  <rect x="13" y="22" width="2.5" height="31" rx="1" fill="#FF6B00" opacity="0.38"/>
  <rect x="18" y="18" width="2.5" height="39" rx="1" fill="#FF6B00" opacity="0.52"/>
  <rect x="23" y="14" width="2.5" height="47" rx="1" fill="#FF6B00" opacity="0.68"/>
  <rect x="28" y="10" width="2.5" height="55" rx="1" fill="#FF6B00" opacity="0.84"/>

  <!-- Solid orange square (center of icon) -->
