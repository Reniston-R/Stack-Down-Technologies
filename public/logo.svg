  <rect x="96" y="26" width="2.5" height="23" rx="1" fill="#FF6B00" opacity="0.25"/>

  <!-- Company name text -->
  <text x="112" y="37" font-family="Raleway, sans-serif" font-weight="800" font-size="23" fill="#FFFFFF" letter-spacing="0.3">Stack Down</text>
  <text x="112" y="58" font-family="Raleway, sans-serif" font-weight="700" font-size="19" fill="#FF8C00" letter-spacing="0.3">Technologies</text>
